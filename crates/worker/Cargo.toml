[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
dashmap = "6.2.1"
dotenvy = "0.15.7"
enumset = "1.1.12"
fluxer-neptunium = { workspace = true }
json5 = "1.3.1"
mini-moka = "0.10.3"
nom = "8.0.0"
pretty-duration = "0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqids = "0.4.2"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono"] }
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize = "1.8.2"
api-types = { workspace = true }
tokio-tungstenite = "0.29.0"
futures = "0.3.32"

[lints]
workspace = true

