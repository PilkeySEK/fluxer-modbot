[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
api-types = { workspace = true }
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
json5 = "1.3.1"
oauth2 = "5.0.0"
reqwest = "0.13.4"
serde = "1.0.228"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
fluxer-neptunium = { workspace = true }
serde_json = "1.0.150"
time = "0.3.47"
rand = { version = "0.10.1", features = ["chacha"] }
base64 = "0.22.1"
chrono = "0.4.44"
utoipa-axum = "0.2.0"
utoipa = { version = "5.5.0", features = ["axum_extras", "time"] }
utoipauto = "0.2.0"

[lints]
workspace = true

[features]
default = []
openapi-gen = []
