[package]
name = "api"
version = "0.1.0"
edition = "2024"
build = "../build.rs"

[dependencies]
rust-shared = { workspace = true }
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
json5 = "1.3.1"
oauth2 = "5.0.0"
reqwest = "0.13.5"
serde = "1.0.229"
sqlx = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
fluxer-neptunium = { workspace = true }
serde_json = "1.0.151"
time = "0.3.55"
rand = { workspace = true }
base64 = "0.23.1"
chrono = "0.4.45"
utoipa-axum = "0.3.0"
utoipa = { version = "6.0.0", features = ["axum_extras", "time"] }
utoipauto = "0.3.1"
zeroize = "1.9.0"
moka = { version = "0.12.16", features = ["future"] }
anyhow = { workspace = true }

[lints]
workspace = true

[features]
default = []
openapi-gen = []
