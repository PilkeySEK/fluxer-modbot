[workspace]
resolver = "3"
members = ["api", "rust-shared", "async-brigadier", "worker"]

[workspace.dependencies]
rust-shared = { path = "rust-shared" }
fluxer-neptunium = { version = "0.10.1", features = ["experimental-macros"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "postgres", "macros", "time"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rand = { version = "0.10.4", features = ["chacha"] }
# jiff-sqlx = { version = "1.0.0", features = ["serde", "postgres"] }
jiff = { version = "1.0.1", features = ["serde"] }

[workspace.lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
allow_attributes = "warn"
decimal_literal_representation = "warn"
doc_paragraphs_missing_punctuation = "warn"
suspicious = "warn"
branches_sharing_code = "warn"
style = "warn"
perf = "warn"
complexity = "warn"
needless_raw_strings = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
unreadable_literal = { level = "allow", priority = 1 }
str_to_string = "warn"
