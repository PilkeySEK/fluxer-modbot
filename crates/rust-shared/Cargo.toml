[package]
name = "rust-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = "1.0.229"
utoipa-axum = "0.3.0"
utoipa = { version = "6.0.0", features = ["axum_extras", "time", "jiff_0_2"] }
fluxer-neptunium = { workspace = true }
strum = { version = "0.28.0", features = ["derive"] }
sqids = "0.4.2"
sqlx = { workspace = true }
serde_json = "1.0.154"
enum-map = { version = "3.1.0", features = ["serde"] }
jiff = { workspace = true }
tokio = { version = "1.54.1", features = ["fs"] }
color-eyre = "0.6.5"
toml = "1.2.2"
secrecy = { version = "0.10.3", features = ["serde"] }
