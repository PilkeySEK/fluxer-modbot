[package]
name = "rust-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = "1.0.229"
utoipa-axum = "0.3.0"
utoipa = { version = "6.0.0", features = ["axum_extras", "time", "chrono"] }
fluxer-neptunium = { workspace = true }
chrono = { version = "0.4.45", features = ["serde"] }
strum = { version = "0.28.0", features = ["derive"] }
sqids = "0.4.2"
sqlx = { workspace = true }
serde_json = "1.0.151"
anyhow = { workspace = true }
enum-map = "3.1.0"
