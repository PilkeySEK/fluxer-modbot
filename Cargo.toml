[package]
name = "neptune-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
enumset = "1.1.12"
fluxer-neptunium = { git = "https://github.com/PilkeySEK/fluxer-neptunium.git", features = ["experimental-macros", "chrono-timestamp-conversion"] }
json5 = "1.3.1"
mini-moka = "0.10.3"
pretty-duration = "0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] } #, "tls-rustls-ring-webpki"] }
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize = "1.8.2"

[lints.clippy]
pedantic = { level = "warn", priority = 0 }
unreadable_literal = { level = "allow", priority = 1 }
