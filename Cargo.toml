[package]
name = "neptune-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
enumset = "1.1.12"
fluxer-neptunium = { git = "https://github.com/PilkeySEK/fluxer-neptunium.git", features = [
    "experimental-macros",
    "chrono-timestamp-conversion",
] }
json5 = "1.3.1"
mini-moka = "0.10.3"
nom = "8.0.0"
pretty-duration = "0.1.1"
serde = { version = "1.0.228", features = ["derive"] }
sqids = "0.4.2"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "time"] }
strum = { version = "0.28.0", features = ["derive"] }
time = "0.3.47"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize = "1.8.2"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
allow_attributes = "warn"
decimal_literal_representation = "warn"
doc_paragraphs_missing_punctuation = "warn"
suspicious = "warn"
branches_sharing_code = "warn"
style = "warn"
perf = "warn"
complexity = "warn"
needless_raw_strings = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
unreadable_literal = { level = "allow", priority = 1 }
